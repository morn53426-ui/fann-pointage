name: FANN POINTAGE CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 ne prend pas encore en charge Ubuntu 26.04.
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Audit des dépendances de production
        run: npm audit --omit=dev
      - name: Vérifier l'absence de fichiers privés et de secrets livrables
        run: npm run check:delivery
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Vérifier les tests
        run: npm test
      - name: Tester le chiffrement et l’intégrité des sauvegardes
        run: npm run test:backup
      - name: Vérifier les scripts navigateur
        run: |
          node --check web/app.js
          node --check web/sw.js
          node --check web/vendor/qrcode.js
      - name: Tests sur un vrai PostgreSQL jetable (migrations, QR, concurrence)
        run: npm run test:postgres
      - name: Restauration intégrale d’une archive chiffrée sur PostgreSQL tmpfs
        run: npm run test:backup-restore
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests navigateur (Playwright)
        run: npm run test:e2e
      - name: Conserver le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
