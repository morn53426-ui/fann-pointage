name: fann-pointage

services:
  # UNE SEULE instance de « app » : le limiteur de tentatives de connexion est en mémoire (non partagé entre instances).
  # Ne pas utiliser « deploy.replicas » ni « --scale app=N » (voir docs/PREPARATION_PRODUCTION.md).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fann-pointage:local
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      FANN_MODE: ${FANN_MODE:-postgres-catalogue}
      FANN_MDP_PROVISOIRE: ${FANN_MDP_PROVISOIRE:-aleatoire}
      FANN_ENV: ${FANN_ENV:-}
      # Utilisé uniquement par FANN_MODE=demo ; facultatif (mot de passe aléatoire affiché au démarrage si absent).
      # ADMIN_INITIAL_MOT_DE_PASSE n'est volontairement PAS transmis au conteneur : il n'est lu que par « npm run admin:postgres » sur la machine hôte.
      # Le compte runtime est séparé du compte bootstrap/migration POSTGRES_USER.
      # Gardez POSTGRES_APP_PASSWORD URL-safe (base64url, généré par npm run setup:env).
      DEMO_MOT_DE_PASSE: "${DEMO_MOT_DE_PASSE:-}"
      DATABASE_URL: "postgresql://fann_app:${POSTGRES_APP_PASSWORD:?Définissez POSTGRES_APP_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-fann_pointage}"
      SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET dans .env}
      BADGE_SECRET: ${BADGE_SECRET:?Définissez BADGE_SECRET dans .env}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS:-5000}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-60000}
      PG_IDLE_TX_TIMEOUT_MS: ${PG_IDLE_TX_TIMEOUT_MS:-15000}
      PG_LOCK_TIMEOUT_MS: ${PG_LOCK_TIMEOUT_MS:-5000}
      PGSSL: ${PGSSL:-}
      DATA_DIR: /data
      # 1 uniquement derrière un reverse proxy de confiance qui pose X-Forwarded-For ; sinon toutes les connexions partagent l'IP de la passerelle Docker.
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # Géorepérage facultatif pour les essais GPS : les deux coordonnées sont nécessaires.
      # Ne pas utiliser des coordonnées fictives pour valider un pointage réel.
      ZONE_LAT: "${ZONE_LAT:-}"
      ZONE_LNG: "${ZONE_LNG:-}"
      ZONE_RAYON: "${ZONE_RAYON:-150}"
    ports:
      # Gardez 127.0.0.1 pour les essais locaux. Sur le LAN de l'hôpital, configurez APP_BIND_ADDRESS=0.0.0.0 et limitez le pare-feu au réseau interne.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8787}:8787"
    read_only: true
    volumes:
      - fann_runtime_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${APP_MEMORY_LIMIT:-384m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    depends_on:
      db:
        condition: service_healthy
      # Les migrations et les droits du rôle runtime sont appliqués (de façon idempotente) avant chaque démarrage de l'application.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Tâche ponctuelle : applique les migrations applicatives 0013 à 0027 manquantes (en vérifiant l’ENUM 0017) puis les droits de fann_app (volume neuf ou existant).
  # Utilise le compte administrateur uniquement ici ; il n'est jamais transmis au conteneur « app ». Aucune donnée n'est supprimée.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: fann-pointage:local
    init: true
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate-catalogue.mjs && node scripts/configurer-role-application.mjs"]
    environment:
      DATABASE_ADMIN_URL: "postgresql://${POSTGRES_USER:-fann_admin}:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-fann_pointage}"
      POSTGRES_APP_USER: fann_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Définissez POSTGRES_APP_PASSWORD dans .env}
      PGSSL: ${PGSSL:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-256m}
    cpus: ${MIGRATE_CPU_LIMIT:-1.0}
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: fann-pointage-db:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fann_pointage}
      # Compte superutilisateur réservé au bootstrap/migrations ; jamais transmis à l'application.
      POSTGRES_USER: ${POSTGRES_USER:-fann_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      # Compte runtime. Les scripts d'initialisation lui accordent les droits applicatifs nécessaires, sans SUPERUSER.
      POSTGRES_APP_USER: fann_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Définissez POSTGRES_APP_PASSWORD dans .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Base non exposée au réseau local par défaut ; changez seulement si nécessaire.
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - fann_pgdata:/var/lib/postgresql/data
    shm_size: ${DB_SHM_SIZE:-256mb}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true
    # Test en TCP : pendant l'initialisation, Postgres démarre un serveur temporaire qui n'écoute que sur un socket local.
    # Sans -h, la base était déclarée « healthy » trop tôt et « migrate » échouait avec ECONNREFUSED.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  fann_runtime_data:
    name: fann-pointage-runtime-data
  fann_pgdata:
    name: fann-pointage-postgres-data
